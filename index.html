<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShiftWorkPay</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324D">
<meta name="description" content="Log your shift hours and see your paycheck before payday.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShiftWorkPay">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky period bar on top, bottom tab bar, content cards between. Dispatch-console feel: deep slate + signal amber. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#D6DEE7;
  --fg:#14202E; --muted:#5A6878; --navy:#17324D; --on-navy:#FFFFFF;
  --accent:#C77A0A; --accent-soft:#FBEBD0; --good:#1E7A4C; --good-soft:#DDF1E5;
  --tax:#B4483A; --input:#FFF8E6; --input-line:#E8C980; --focus:#2F6FB3;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#16222F; --surface-2:#1B2A39; --line:#2A3B4D;
  --fg:#E8EEF4; --muted:#93A3B5; --navy:#0A2236; --on-navy:#F2F6FA;
  --accent:#F0A63A; --accent-soft:#3A2A12; --good:#4CC488; --good-soft:#143326;
  --tax:#F08A7A; --input:#22303F; --input-line:#5C4A22; --focus:#6FA8E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16222F; --surface-2:#1B2A39; --line:#2A3B4D;
  --fg:#E8EEF4; --muted:#93A3B5; --navy:#0A2236; --on-navy:#F2F6FA;
  --accent:#F0A63A; --accent-soft:#3A2A12; --good:#4CC488; --good-soft:#143326;
  --tax:#F08A7A; --input:#22303F; --input-line:#5C4A22; --focus:#6FA8E8; color-scheme:dark}
html,body{height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy);padding:10px 16px 12px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;max-width:640px;margin:0 auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.brand h1 b{color:var(--accent)}
.save{font-size:11.5px;opacity:.75}
.period{display:flex;align-items:center;gap:8px;max-width:640px;margin:8px auto 0}
.period .lbl{flex:1;min-width:0;text-align:center}
.period .dates{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.02em}
.period .pay{font-size:12px;opacity:.8}
.arrow{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--on-navy);font-size:20px;line-height:1}
.today-btn{font-size:11px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--on-navy);border-radius:20px;padding:2px 10px;margin-top:2px}

main{max-width:640px;margin:0 auto;padding:16px 16px 110px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.banner{background:var(--accent-soft);border:1px solid var(--input-line);border-radius:var(--r);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--tax)}

/* net hero */
.hero{background:var(--navy);color:var(--on-navy);border:none}
.hero .k{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;font-size:14px;opacity:.85}
.hero .net{font-family:var(--f-num);font-size:44px;font-weight:600;line-height:1.1;margin:4px 0 2px;color:var(--accent)}
.hero .sub{font-size:13px;opacity:.85}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 8px;background:rgba(255,255,255,.15)}
.split span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;opacity:.95}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px}
.stat .v{font-family:var(--f-num);font-size:16px;font-weight:600}
.stat .l{font-size:11px;opacity:.8}

/* line tables */
.lines{display:grid;gap:0}
.line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border-bottom:none}
.line .d{color:var(--muted);font-size:12.5px}
.line.total{font-weight:600;border-top:2px solid var(--fg);border-bottom:none;padding-top:9px;margin-top:2px}
.line .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.minus{color:var(--tax)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
details[open] summary{margin-bottom:8px}

/* hours */
.week-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.week-h h2{margin:0}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:4px 0 12px;border:1px solid var(--line)}
.meter span{display:block;height:100%;background:var(--accent)}
.day{border-top:1px solid var(--line)}
.day:first-of-type{border-top:none}
.day-row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:10px 0;text-align:left}
.day-date{width:56px;flex:none}
.day-date b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1}
.day-date span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;border-radius:20px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.ot{background:var(--accent-soft);border-color:var(--input-line)}
.chip.off{color:var(--muted);border-style:dashed;background:transparent}
.day-amt{font-family:var(--f-num);font-size:14px;white-space:nowrap}
.today .day-date b{color:var(--accent)}
.editor{padding:4px 0 14px;display:grid;gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--input-line);background:var(--input);border-radius:20px;padding:6px 11px;font-size:13px;font-weight:600}
.quick button.clear{background:transparent;border-color:var(--line);color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,textarea{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--input-line);border-radius:8px;padding:8px;width:100%;min-width:0}
.f input{text-align:center;font-family:var(--f-num);font-size:16px;padding:7px 4px}
textarea{font-family:var(--f-num);font-size:12px;min-height:80px;resize:vertical}

/* setup form */
.form{display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center}
.row > label{font-size:14px}
.row small,.hint{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.computed{font-family:var(--f-num);text-align:right;padding:8px;color:var(--muted)}
.mults{display:grid;grid-template-columns:1fr 80px 90px;gap:8px 10px;align-items:center;font-size:14px}
.mults .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mults .rate{font-family:var(--f-num);text-align:right}
.ded{display:grid;grid-template-columns:1fr 84px 64px 34px;gap:6px;align-items:center}
.ded + .ded{margin-top:2px}
.ded-flags{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 10px}
.ded-flags label{display:flex;gap:5px;align-items:center}
.ded-flags input{width:auto}
.x{border:none;background:none;color:var(--muted);font-size:20px;padding:0}

/* history */
.hist{display:grid;gap:0}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline;background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%}
.hrow:last-child{border-bottom:none}
.hrow .p{font-weight:600}
.hrow .s{grid-column:1/-1;font-size:12px;color:var(--muted)}
.hrow .g,.hrow .n{font-family:var(--f-num);text-align:right}
.hrow .n{color:var(--good);font-weight:600}
.ytd{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ytd div{background:var(--surface-2);border-radius:10px;padding:10px}
.ytd .v{font-family:var(--f-num);font-weight:600;font-size:17px}
.ytd .l{font-size:12px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:640px}
nav.tabs button{border:none;background:none;padding:6px 0;border-radius:10px;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;justify-items:center;gap:1px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}
@media (max-width:420px){.row{grid-template-columns:1fr 128px}.hero .net{font-size:38px}}
.fields{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.f label{white-space:normal!important;line-height:1.2;min-height:2.4em;display:flex;align-items:flex-end}
@media (prefers-reduced-motion:no-preference){.editor{animation:drop .16s ease-out}@keyframes drop{from{opacity:.4;transform:translateY(-4px)}}}
/* v2: month jump, pay types, leave */
.dates-btn{background:none;border:none;color:var(--on-navy);padding:0;font:inherit;display:inline-flex;align-items:center;gap:6px}
.dates-btn .caret{font-size:12px;opacity:.75;transition:transform .15s}
.dates-btn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.jump{max-width:640px;margin:10px auto 0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px}
.jump-yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.jump-yr b{font-family:var(--f-display);font-size:18px;letter-spacing:.04em}
.jump-yr button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--on-navy);font-size:18px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.months button{position:relative;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--on-navy);border-radius:8px;padding:8px 0;font-weight:600;font-size:14px}
.months button.cur{background:var(--accent);border-color:var(--accent);color:#1a1205}
.months button i{position:absolute;top:4px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.months button.cur i{background:#1a1205}
.jump-date{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px}
.jump-date input{background:rgba(255,255,255,.95);color:#14202E;border:none;max-width:170px}
.ptype{border-top:1px solid var(--line);padding:10px 0}
.ptype:first-of-type{border-top:none}
.ptype-main{display:grid;grid-template-columns:1fr 66px 52px 64px;gap:6px;align-items:center}
.ptype-flags{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.ptype-flags label{display:flex;gap:5px;align-items:center}
.ptype-flags input[type=checkbox]{width:auto}
.ptype-flags select{width:auto;padding:3px 6px;font-size:12px}
.ptype-flags .rate{margin-left:auto;font-family:var(--f-num);color:var(--fg);font-size:13px}
.ptype.hidden-type .ptype-main input{opacity:.55}
.ph{display:grid;grid-template-columns:1fr 66px 52px 64px;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.bank{display:grid;gap:10px}
.bank-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bank-top h3{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.03em}
.bank-bal{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1}
.bank-bal small{font-size:13px;color:var(--muted);font-weight:500}
.bank-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bank-stats div{background:var(--surface-2);border-radius:8px;padding:7px 8px}
.bank-stats .v{font-family:var(--f-num);font-weight:600;font-size:14px}
.bank-stats .l{font-size:11px;color:var(--muted)}
.neg{color:var(--tax)}
nav.tabs div{grid-template-columns:repeat(5,1fr)!important}
nav.tabs button{font-size:13.5px!important}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>ShiftWork<b>Pay</b></h1><span class="save" id="saveState">Loading…</span></div>
  <div class="period">
    <button class="arrow" id="prev" aria-label="Previous pay period">‹</button>
    <div class="lbl">
      <button class="dates-btn" id="datesBtn" aria-expanded="false" aria-controls="jump"><span class="dates" id="pDates">—</span><span class="caret" aria-hidden="true">▼</span></button>
      <div class="pay" id="pPay"></div>
      <button class="today-btn" id="todayBtn" hidden>Jump to current period</button>
    </div>
    <button class="arrow" id="next" aria-label="Next pay period">›</button>
  </div>
  <div class="jump" id="jump" hidden></div>
</header>

<main id="main"></main>

<nav class="tabs" aria-label="Sections"><div>
  <button data-tab="check" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Check</button>
  <button data-tab="hours"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Hours</button>
  <button data-tab="leave"><svg viewBox="0 0 24 24"><path d="M5 20V9l7-5 7 5v11z"/><path d="M9 20v-6h6v6"/></svg>Leave</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V10M12 16V6M17 16v-4"/></svg>History</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
</div></nav>

<script>
/* ===================== TAX DATA (2026) — update each January ===================== */
const TAX_YEAR = 2026;
const FED = {
  rates:[0.10,0.12,0.22,0.24,0.32,0.35,0.37],
  single:{std:16100, br:[0,12400,50400,105700,201775,256225,640600]},
  mfj:{std:32200, br:[0,24800,100800,211400,403550,512450,768700]},
  hoh:{std:24150, br:[0,17700,67450,105700,201750,256200,640600]},
  childCredit:2200, otherCredit:500, ssRate:0.062, medRate:0.0145
};
const STATES = {"Alabama":.04,"Alaska":0,"Arizona":.025,"Arkansas":.039,"California":.05,"Colorado":.044,"Connecticut":.05,"Delaware":.05,"District of Columbia":.06,"Florida":0,"Georgia":.0519,"Hawaii":.07,"Idaho":.053,"Illinois":.0495,"Indiana":.0295,"Iowa":.038,"Kansas":.052,"Kentucky":.035,"Louisiana":.03,"Maine":.06,"Maryland":.0475,"Massachusetts":.05,"Michigan":.0425,"Minnesota":.06,"Mississippi":.044,"Missouri":.045,"Montana":.055,"Nebraska":.05,"Nevada":0,"New Hampshire":0,"New Jersey":.045,"New Mexico":.045,"New York":.055,"North Carolina":.0399,"North Dakota":.015,"Ohio":.0275,"Oklahoma":.045,"Oregon":.08,"Pennsylvania":.0307,"Rhode Island":.0475,"South Carolina":.05,"South Dakota":0,"Tennessee":0,"Texas":0,"Utah":.045,"Vermont":.06,"Virginia":.05,"Washington":0,"West Virginia":.045,"Wisconsin":.053,"Wyoming":0};
const FLAT = new Set(["Arizona","Colorado","Idaho","Illinois","Indiana","Iowa","Kentucky","Louisiana","Michigan","North Carolina","Pennsylvania","Utah","Massachusetts","Ohio","Georgia","Mississippi"]);
const NO_TAX = new Set(Object.keys(STATES).filter(s=>STATES[s]===0));
/* Reciprocity: work state -> home states whose residents can have ONLY their home state withheld (after filing the form). */
const RECIP = {
  "Arizona":["California","Indiana","Oregon","Virginia"], "District of Columbia":["Maryland","Virginia"],
  "Illinois":["Iowa","Kentucky","Michigan","Wisconsin"], "Indiana":["Kentucky","Michigan","Ohio","Pennsylvania","Wisconsin"],
  "Iowa":["Illinois"], "Kentucky":["Illinois","Indiana","Michigan","Ohio","Virginia","West Virginia","Wisconsin"],
  "Maryland":["District of Columbia","Pennsylvania","Virginia","West Virginia"], "Michigan":["Illinois","Indiana","Kentucky","Minnesota","Ohio","Wisconsin"],
  "Minnesota":["Michigan","North Dakota"], "Montana":["North Dakota"], "New Jersey":["Pennsylvania"], "North Dakota":["Minnesota","Montana"],
  "Ohio":["Indiana","Kentucky","Michigan","Pennsylvania","West Virginia"], "Pennsylvania":["Indiana","Maryland","New Jersey","Ohio","Virginia","West Virginia"],
  "Virginia":["District of Columbia","Kentucky","Maryland","Pennsylvania","West Virginia"], "West Virginia":["Kentucky","Maryland","Ohio","Pennsylvania","Virginia"],
  "Wisconsin":["Illinois","Indiana","Kentucky","Michigan"]
};
const RECIP_FORM = {"Arizona":"WEC","District of Columbia":"D-4A","Illinois":"IL-W-5-NR","Indiana":"WH-47","Iowa":"44-016","Kentucky":"42A809","Maryland":"MW507","Michigan":"MI-W4","Minnesota":"MWR","Montana":"MW-4","New Jersey":"NJ-165","North Dakota":"NDW-R","Ohio":"IT 4NR","Pennsylvania":"REV-419","Virginia":"VA-4","West Virginia":"WV/IT-104NR","Wisconsin":"W-220"};

/* ===================== PAY TYPES (defaults — each person can rename, change, hide or add) =====================
   kind "mult" = base rate × val;  kind "flat" = val dollars per hour.
   worked = counts toward hours worked (overtime).  bank = leave bank these hours are taken from.
   earn = leave bank these hours are added to, at earnRate (comp time banked instead of paid). */
function defaultTypes(){
  return [
    {k:"reg", label:"Regular", short:"Reg", kind:"mult", val:1,   worked:true,  show:true},
    {k:"ot",  label:"Overtime", short:"OT", kind:"mult", val:1.5, worked:true,  show:true},
    {k:"dt",  label:"Double time", short:"DT", kind:"mult", val:2, worked:true, show:true},
    {k:"hw",  label:"Holiday worked", short:"Hol wk", kind:"mult", val:1.5, worked:true, show:true},
    {k:"hot", label:"Holiday OT", short:"Hol OT", kind:"mult", val:2, worked:true, show:true},
    {k:"prem",label:"Premium", short:"Prem", kind:"flat", val:1, worked:false, show:true},
    {k:"hp",  label:"Paid holiday", short:"Hol pd", kind:"mult", val:1, worked:false, show:true},
    {k:"vac", label:"Vacation used", short:"Vac", kind:"mult", val:1, worked:false, show:true, bank:"vac"},
    {k:"sick",label:"Sick used", short:"Sick", kind:"mult", val:1, worked:false, show:true, bank:"sick"},
    {k:"pers",label:"Personal used", short:"Pers", kind:"mult", val:1, worked:false, show:true, bank:"pers"},
    {k:"cu",  label:"Comp time used", short:"Comp", kind:"mult", val:1, worked:false, show:true, bank:"comp"},
    {k:"ce",  label:"OT banked as comp", short:"Comp+", kind:"mult", val:0, worked:true, show:true, earn:"comp", earnRate:1.5},
    {k:"lv",  label:"Sick/Comp/Vac (older entries)", short:"Leave", kind:"mult", val:1, worked:false, show:false},
  ];

/* ===================== DATES ===================== */
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function dayDiff(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);}
function periodLen(s){return s.freq===52?7:14;}
function currentPeriodStart(s,d){const a=parseISO(s.anchor);const L=periodLen(s);const k=Math.floor(dayDiff(a,d)/L);return addDays(a,k*L);}
function firstPeriodInMonth(s,y,m){const first=new Date(y,m,1);let p=currentPeriodStart(s,first);if(p<first)p=addDays(p,periodLen(s));return p;}
function periodEndsUpTo(s,d){return Math.floor((dayDiff(parseISO(s.anchor),d)+1)/periodLen(s));}
const fmtD = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const money = n => (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const hrs = n => (Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
const r2 = n => Math.round((n+Number.EPSILON)*100)/100;
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ===================== CALC ENGINE (mirrors the spreadsheet) ===================== */
function typeRate(s,t){return t.kind==="flat"?(+t.val||0):(+s.rate||0)*(+t.val||0);}
function annualFedTax(x,s){
  const t=FED[s.status]; const half=s.step2?0.5:1;
  const std=t.std*half; let tax=0;
  for(let i=0;i<FED.rates.length;i++){
    const lo=std+t.br[i]*half, hi=i+1<FED.rates.length?std+t.br[i+1]*half:Infinity;
    if(x>lo) tax+=(Math.min(x,hi)-lo)*FED.rates[i];
  }
  return tax;
}
function stateSetup(s){
  const work=s.state, home=s.homeState||s.state;
  const own=s.stateOverride!==""&&s.stateOverride!=null?(+s.stateOverride)/100:null;
  if(home===work) return {kind:"same",work,home,wState:work,rate:own??(STATES[work]??0),gap:0};
  if((RECIP[work]||[]).includes(home)) return {kind:"recip",work,home,wState:home,rate:own??(STATES[home]??0),gap:0,form:RECIP_FORM[work]};
  const rate=own??(STATES[work]??0);
  return {kind:"none",work,home,wState:work,rate,gap:Math.max(0,(STATES[home]??0)-rate)};
}
function stateRate(s){return stateSetup(s).rate;}
function isPremiumRate(t){return t.worked&&t.kind==="mult"&&+t.val>1;}
function calcPeriod(s,start){
  const L=periodLen(s), T=s.types;
  const days=[]; const tot={}; T.forEach(t=>tot[t.k]=0);
  for(let i=0;i<L;i++){const d=addDays(start,i);const h=S.hours[iso(d)]||{};
    let amt=0,worked=0;T.forEach(t=>{const v=+h[t.k]||0;tot[t.k]+=v;amt+=v*typeRate(s,t);if(t.worked)worked+=v;});
    days.push({d,h,amt,worked});}
  const earn=T.map(t=>({...t,hours:tot[t.k],rate:typeRate(s,t),amount:r2(tot[t.k]*typeRate(s,t))}));
  const gross=r2(earn.reduce((a,e)=>a+e.amount,0));
  const skipped=new Set(((S.skip||{})[iso(start)])||[]);
  const deds=s.deds.filter(d=>d.name).map(d=>({...d,off:skipped.has(d.name),amt:skipped.has(d.name)?0:r2(d.type==="%"?(+d.amount/100)*gross:+d.amount||0)}));
  const imputed=gross>0?(+s.imputed||0):0;
  const preInc=deds.filter(d=>d.preInc).reduce((a,d)=>a+d.amt,0);
  const preFica=deds.filter(d=>d.preFica).reduce((a,d)=>a+d.amt,0);
  const taxable=Math.max(0,gross+imputed-preInc);
  const P=s.freq;
  const annual=taxable*P, adj=Math.max(0,annual+(+s.s4a||0)-(+s.s4b||0));
  const yearTax=annualFedTax(adj,s);
  const credits=(s.step3amt!==""&&s.step3amt!=null)?(+s.step3amt||0):(+s.kids||0)*FED.childCredit+(+s.others||0)*FED.otherCredit;
  const afterCred=Math.max(0,yearTax-credits);
  const fed=s.exempt?0:r2(afterCred/P)+(+s.s4c||0);
  const ficaW=Math.max(0,gross+imputed-preFica);
  const ss=r2(ficaW*FED.ssRate), med=r2(ficaW*FED.medRate);
  const SS_=stateSetup(s);
  const exemptYr=SS_.wState==="Indiana"?(+s.inPersonal||0)*1000+(+s.inAddl||0)*1500+(+s.inAdopt||0)*3000:0;
  const exPer=r2(exemptYr/P);
  const stW=Math.max(0,taxable-exPer);
  const sr=stateRate(s);
  const st=r2(stW*sr)+(+s.stateExtra||0);
  const homeW=(SS_.kind==="none"&&s.homeWithhold&&SS_.gap>0)?r2(taxable*SS_.gap):0;
  const homeGap=(SS_.kind==="none"&&!s.homeWithhold&&SS_.gap>0)?r2(taxable*SS_.gap):0;
  const coW=s.countyUsesExempt===false?taxable:stW;
  const co=r2(coW*(+s.countyRate||0))+(+s.countyExtra||0);
  const taxes=r2(fed+ss+med+st+co+homeW);
  const dedTot=r2(deds.reduce((a,d)=>a+d.amt,0));
  const net=r2(gross-taxes-dedTot);
  const worked=T.filter(t=>t.worked).reduce((a,t)=>a+tot[t.k],0);
  const paid=T.filter(t=>t.kind==="mult"&&+t.val>0).reduce((a,t)=>a+tot[t.k],0);
  const premHrs=T.filter(isPremiumRate).reduce((a,t)=>a+tot[t.k],0);
  return {SS_,homeW,homeGap,imputed,coW,days,earn,gross,deds,preInc,preFica,taxable,annual,adj,yearTax,credits,afterCred,fed,ficaW,ss,med,exPer,stW,sr,st,co,taxes,dedTot,net,worked,paid,premHrs,tot};
}

/* ===================== LEAVE BANKS ===================== */
function bankBalance(s,b,upTo){
  const asOf=parseISO(b.asOf||iso(new Date()));
  if(upTo<asOf) return {bal:+b.start||0,accrued:0,used:0,earned:0};
  const periods=Math.max(0,periodEndsUpTo(s,upTo)-periodEndsUpTo(s,asOf));
  const accrued=periods*(+b.accrual||0);
  let used=0,earned=0;
  const useT=s.types.filter(t=>t.bank===b.id), earnT=s.types.filter(t=>t.earn===b.id);
  Object.keys(S.hours).forEach(k=>{const d=parseISO(k);if(d<=asOf||d>upTo)return;const h=S.hours[k];
    useT.forEach(t=>used+=+h[t.k]||0); earnT.forEach(t=>earned+=(+h[t.k]||0)*(+t.earnRate||1));});
  let bal=(+b.start||0)+accrued+earned-used;
  if(b.max!==""&&b.max!=null&&!isNaN(+b.max)&&+b.max>0) bal=Math.min(bal,+b.max);
  return {bal,accrued,used,earned};
}
function yearActivity(s,b,year){
  let used=0,earned=0;
  const useT=s.types.filter(t=>t.bank===b.id), earnT=s.types.filter(t=>t.earn===b.id);
  Object.keys(S.hours).forEach(k=>{if(!k.startsWith(String(year)))return;const h=S.hours[k];
    useT.forEach(t=>used+=+h[t.k]||0); earnT.forEach(t=>earned+=(+h[t.k]||0)*(+t.earnRate||1));});
  return {used,earned};
}

    <div class="line"><span>× ${s.freq} checks = yearly pace</span><span class="amt">${money(c.annual)}</span></div>
    <div class="line"><span>Adjusted for W-4 Step 4(a)/(b)</span><span class="amt">${money(c.adj)}</span></div>
    <div class="line"><span>Yearly tax from IRS ${TAX_YEAR} table</span><span class="amt">${money(c.yearTax)}</span></div>
    <div class="line"><span>Minus W-4 Step 3 credits</span><span class="amt">${money(c.credits)}</span></div>
    <div class="line"><span>÷ ${s.freq}, plus Step 4(c) extra</span><span class="amt">${money(c.fed)}</span></div>
    <div class="line"><span>State exemptions per check</span><span class="amt">${money(c.exPer)}</span></div>
    <div class="line"><span>State taxable wages</span><span class="amt">${money(c.stW)}</span></div>
    <div class="line"><span>County taxable wages</span><span class="amt">${money(c.coW)}</span></div>
  </div><p class="fine">Federal uses the IRS ${TAX_YEAR} percentage method (Pub. 15-T) for the 2020-and-later W-4. Estimates can differ from your stub by a few dollars. This isn't tax advice.</p></details></section>`;
}

function chipsFor(hh){
  const parts=S.setup.types.filter(t=>+hh[t.k]).map(t=>`<span class="chip${isPremiumRate(t)?" ot":""}">${hrs(+hh[t.k])} ${esc(t.short||t.label)}</span>`);
  return parts.length?parts.join(""):`<span class="chip off">Off</span>`;
}
function viewHours(){
  const c=calcPeriod(S.setup,periodStart);
  const todayIso=iso(new Date());
  const weeks=[];for(let i=0;i<c.days.length;i+=7)weeks.push(c.days.slice(i,i+7));
  return weeks.map((w,wi)=>{
    const worked=w.reduce((a,d)=>a+d.worked,0), amt=w.reduce((a,d)=>a+d.amt,0);
    return `<section class="card"><div class="week-h"><h2>Week ${wi+1}</h2><span class="fine num">${hrs(worked)} hrs worked · ${money(amt)}</span></div>
    <div class="meter" title="Hours worked toward 40"><span style="width:${Math.min(100,worked/40*100)}%"></span></div>
    ${w.map(d=>{const k=iso(d.d);const open=openDay===k;return `<div class="day${k===todayIso?" today":""}">
      <button class="day-row" data-day="${k}" aria-expanded="${open}"><span class="day-date"><b>${d.d.getDate()}</b><span>${d.d.toLocaleDateString("en-US",{weekday:"short"})}</span></span>
      <span class="chips">${chipsFor(d.h)}</span><span class="day-amt">${d.amt?money(d.amt):""}</span></button>
      ${open?editor(k,d.h):""}</div>`;}).join("")}
    </section>`;}).join("")+`<p class="fine">Tap a day to enter hours. Leave and paid holiday hours are paid, but they don't count toward hours worked for overtime. Rename, add or hide pay types in Setup.</p>`;
}
function editor(k,hh){
  const T=S.setup.types, has=x=>T.some(t=>t.k===x&&t.show);
  const q=[];
  if(has("reg")){q.push(["reg:8","8 Reg"],["reg:12","12 Reg"]);}
  if(has("ot")){q.push(["+ot:4","+4 OT"],["ot:8","8 OT"],["ot:12","12 OT"]);}
  T.filter(t=>t.show&&t.bank).forEach(t=>q.push([t.k+":8","8 "+(t.short||t.label)]));
  if(has("hp"))q.push(["hp:8","8 Hol pd"]);
  const fields=T.filter(t=>t.show||+hh[t.k]);
  return `<div class="editor"><div class="quick">${q.map(([d,l])=>`<button data-q="${esc(d)}">${esc(l)}</button>`).join("")}
    <button class="clear" data-q="clear">Clear day</button></div>
    <div class="fields">${fields.map(t=>`<div class="f"><label for="h-${esc(t.k)}" title="${esc(t.label)}">${esc(t.label)}</label><input id="h-${esc(t.k)}" data-h="${esc(t.k)}" inputmode="decimal" value="${+hh[t.k]?+hh[t.k]:""}" placeholder="0"></div>`).join("")}</div></div>`;
}

function viewLeave(){
  const s=S.setup, today=new Date(), L=periodLen(s), pEnd=addDays(periodStart,L-1), y=today.getFullYear();
  const nextEnd=addDays(parseISO(s.anchor),(periodEndsUpTo(s,today)+1)*L-1);
  return `<section class="card"><h2>Leave balances</h2><p class="fine" style="margin:0">Enter each balance from your latest pay stub and the date it's from. ShiftWorkPay adds what you earn each pay period and subtracts leave you log on the Hours tab.</p></section>
  ${s.banks.map((b,i)=>{const now=bankBalance(s,b,today), then=bankBalance(s,b,pEnd), ya=yearActivity(s,b,y);
    const showThen=iso(pEnd)!==iso(currentPeriodStart(s,today)) && dayDiff(today,pEnd)!==0;
    return `<section class="card bank">
      <div class="bank-top"><h3>${esc(b.name)}</h3><div class="bank-bal${now.bal<0?" neg":""}">${hrs(now.bal)} <small>hrs</small></div></div>
      <div class="bank-stats">
        <div><div class="v">${hrs(ya.used)}</div><div class="l">used in ${y}</div></div>
        <div><div class="v">${+b.accrual?"+"+hrs(+b.accrual):"—"}</div><div class="l">${+b.accrual?"next on "+fmtD(nextEnd):"no accrual set"}</div></div>
        <div><div class="v">${money(now.bal*(+s.rate||0))}</div><div class="l">worth at your rate</div></div>
      </div>
      ${showThen?`<p class="fine" style="margin:0">By the end of the period you're viewing (${fmtD(pEnd)}): <b>${hrs(then.bal)} hrs</b></p>`:""}
      ${ya.earned?`<p class="fine" style="margin:0">Earned from banked OT in ${y}: ${hrs(ya.earned)} hrs</p>`:""}
      <details data-bank="${i}" ${openBanks[i]?"open":""}><summary>Update ${esc(b.name.toLowerCase())}</summary><div class="form" style="margin-top:6px">
        <div class="row"><label for="bn${i}">Name</label><input id="bn${i}" data-b="${i}:name" value="${esc(b.name)}"></div>
        <div class="row"><label for="bs${i}">Balance on your stub (hours)</label><input id="bs${i}" data-b="${i}:start" inputmode="decimal" value="${b.start}"></div>
        <div class="row"><label for="ba${i}">As of date<small>The stub's period end date</small></label><input id="ba${i}" type="date" data-b="${i}:asOf" value="${esc(b.asOf)}"></div>
        <div class="row"><label for="bc${i}">Hours earned each pay period</label><input id="bc${i}" data-b="${i}:accrual" inputmode="decimal" value="${b.accrual}"></div>
        <div class="row"><label for="bm${i}">Maximum you can carry<small>Optional</small></label><input id="bm${i}" data-b="${i}:max" inputmode="decimal" value="${esc(b.max)}" placeholder="none"></div>
        <button class="btn small danger" data-delbank="${i}">Remove ${esc(b.name)}</button>
      </div></details>
    </section>`;}).join("")}
  <button class="btn small" data-act="addBank">+ Add a leave type</button>
  <p class="fine">Pay types that use each bank are set in Setup → Pay types. "OT banked as comp" adds 1.5 hours of comp time for every hour, instead of paying it.</p>`;
}

function periodsWithHours(){
  const s=S.setup,L=periodLen(s);const starts=new Set();
  Object.keys(S.hours).forEach(k=>{const hh=S.hours[k];if(!s.types.some(t=>+hh[t.k]))return;starts.add(iso(currentPeriodStart(s,parseISO(k))));});
  return [...starts].sort().reverse().map(st=>{const d=parseISO(st);return {d,c:calcPeriod(s,d),end:addDays(d,L-1)};});
}
function viewHistory(){
  const list=periodsWithHours();
  const yr=list.filter(p=>addDays(p.end,+S.setup.payLag||0).getFullYear()===new Date().getFullYear());
  const sum=f=>yr.reduce((a,p)=>a+f(p.c),0);
  return `<section class="card"><h2>${new Date().getFullYear()} so far · paydays logged here</h2><div class="ytd">
    <div><div class="v">${money(sum(c=>c.gross))}</div><div class="l">Gross</div></div>
    <div><div class="v" style="color:var(--good)">${money(sum(c=>c.net))}</div><div class="l">Net</div></div>
    <div><div class="v">${money(sum(c=>c.taxes))}</div><div class="l">Taxes</div></div>
    <div><div class="v">${hrs(sum(c=>c.premHrs))}</div><div class="l">Hours at 1.5× or more</div></div></div></section>
  <section class="card"><h2>Pay periods</h2><div class="hist">${list.length?list.map(p=>`<button class="hrow" data-jump="${iso(p.d)}">
    <span class="p">${fmtD(p.d)} – ${fmtD(p.end)}</span><span class="g">${money(p.c.gross)}</span><span class="n">${money(p.c.net)}</span>
    <span class="s">Paid ${fmtD(addDays(p.end,+S.setup.payLag||0))} · ${hrs(p.c.worked)} hrs worked · fed ${money(p.c.fed)}</span></button>`).join(""):`<p class="fine">Periods show up here once you log hours.</p>`}</div></section>
  <section class="card"><h2>Backup & move to another device</h2>
    <p class="fine">Your hours are saved on this phone, in this browser, and nowhere else. There's no account, and nobody else can see them. Save a backup file every few paychecks, and use it to move to a new phone.</p>
    <div style="display:grid;gap:8px"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small primary" data-act="saveFile">Save backup file</button><label class="btn small" for="openFile">Open backup file</label><input type="file" id="openFile" accept=".txt,.json,text/plain" hidden></div>
    <p class="fine" style="margin:6px 0 0">Or use a backup code instead:</p>
    <button class="btn small" data-act="export">Show my backup code</button>
    <textarea id="code" placeholder="Paste a backup code here to load it" aria-label="Backup code"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-act="copy">Copy code</button><button class="btn small primary" data-act="import">Load pasted code</button></div>
    <p class="fine" id="codeMsg" role="status"></p></div></section>`;
}

function opt(v,cur,label){return `<option value="${esc(v)}"${String(v)===String(cur)?" selected":""}>${esc(label??v)}</option>`;}
function typeRows(s){
  const bankOpts=(cur)=>opt("",cur||"","None")+s.banks.map(b=>opt(b.id,cur||"",b.name)).join("");
  return `<div class="ph"><span>Name</span><span>Short</span><span>Type</span><span>Value</span></div>`+
  s.types.map((t,i)=>`<div class="ptype${t.show?"":" hidden-type"}">
    <div class="ptype-main">
      <input aria-label="Pay type name" data-t="${i}:label" value="${esc(t.label)}">
      <input aria-label="Short label" data-t="${i}:short" value="${esc(t.short)}" maxlength="8">
      <select aria-label="Multiplier or flat dollars" data-t="${i}:kind">${opt("mult",t.kind,"×")}${opt("flat",t.kind,"$")}</select>
      <input aria-label="${t.kind==="flat"?"Dollars per hour":"Multiplier"}" data-t="${i}:val" inputmode="decimal" value="${t.val}">
    </div>
    <div class="ptype-flags">
      <label><input type="checkbox" data-t="${i}:show" ${t.show?"checked":""}>Show</label>
      <label><input type="checkbox" data-t="${i}:worked" ${t.worked?"checked":""}>Counts toward OT</label>
      ${t.earn?`<span>Adds ${hrs(+t.earnRate||1)}× to ${esc((s.banks.find(b=>b.id===t.earn)||{}).name||"bank")}</span>`:`<label>Uses leave bank <select data-t="${i}:bank">${bankOpts(t.bank)}</select></label>`}
      <span class="rate" data-rate="${i}">${money(typeRate(s,t))}/hr</span>
      <button class="x" data-deltype="${i}" aria-label="Delete ${esc(t.label)}">×</button>
    </div>${pendingDel===i?delConfirm(t,i):""}</div>`).join("")+
  `<button class="btn small${pickerOpen?" primary":""}" data-act="addType" style="margin-top:8px" aria-expanded="${pickerOpen}">${pickerOpen?"Close list":"+ Add pay type"}</button>
  ${pickerOpen?picker(s):""}
  <p class="fine">× multiplies your base rate (1.5 = time and a half). $ is a flat amount per hour, like a shift differential. Tap × on the right of a type to delete it, or uncheck Show to just hide it.</p>`;
}
function usage(k){let n=0,h=0;Object.values(S.hours).forEach(d=>{if(+d[k]){n++;h+=+d[k];}});return {n,h};}
function delConfirm(t,i){const u=usage(t.k);
  return `<div class="banner" style="margin-top:8px"><p>Delete <b>${esc(t.label)}</b>? You've logged ${hrs(u.h)} hours of it on ${u.n} day${u.n===1?"":"s"}. Those hours will stop counting in your pay. If you add ${esc(t.label)} back later from the list, they'll return.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small danger" data-delyes="${i}">Delete</button><button class="btn small" data-delhide="${i}">Just hide it</button><button class="btn small" data-delno="1">Cancel</button></div></div>`;}
function picker(s){const have=new Set(s.types.map(t=>t.k));
  const groups=LIBRARY.map(g=>{const items=g.items.filter(x=>!have.has(x.k));if(!items.length)return "";
    return `<div style="margin-top:10px"><div class="fine" style="font-weight:600;text-transform:uppercase;letter-spacing:.05em">${esc(g.g)}</div>
    <div class="quick" style="margin-top:6px">${items.map(x=>`<button data-addlib="${x.k}">+ ${esc(x.label)} <span class="fine">${x.kind==="flat"?"$"+x.val+"/hr":x.val+"×"}</span></button>`).join("")}</div></div>`;}).join("");
  return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px">
    ${groups||'<p class="fine" style="margin:0">You already have every pay type on the list.</p>'}
    <div style="margin-top:12px"><button class="btn small" data-act="addCustom">+ Create my own pay type</button></div>
    <p class="fine" style="margin:8px 0 0">After adding one, change its rate or name to match your stub.</p></div>`;}
function stateNote(s){
  const x=stateSetup(s);
  if(x.kind==="same") return "";
  if(x.kind==="recip") return `<p class="banner" style="margin:0"><span>${esc(x.work)} and ${esc(x.home)} have a reciprocity agreement. If you give your employer form <b>${esc(x.form)}</b>, only ${esc(x.home)} tax is withheld. ShiftWorkPay assumes you've filed it. Set the county/local rate below to match your stub, usually 0 in this case.</span></p>`;
  return `<p class="banner" style="margin:0"><span>${esc(x.work)} and ${esc(x.home)} have no reciprocity agreement, so your employer withholds ${esc(x.work)} tax. ${esc(x.home)} usually gives you a credit for it on your return.${x.gap>0?` Because ${esc(x.home)}'s rate is higher, you may owe up to the difference at tax time.`:` ${esc(x.home)}'s rate isn't higher, so you likely won't owe it more.`}</span></p>
  ${x.gap>0?`<div class="row"><label for="homeWithhold">Also withhold the ${esc(x.home)} difference?<small>Some employers do this if you ask. It avoids a bill at tax time.</small></label><select id="homeWithhold" data-s="homeWithhold" data-bool>${opt("false",String(!!s.homeWithhold),"No")}${opt("true",String(!!s.homeWithhold),"Yes")}</select></div>`:""}`;
}

    <div class="row"><label for="step3amt">Or Step 3 total, in dollars<small>Use this if your pay stub shows a "dependent amount." It replaces the two lines above.</small></label><input id="step3amt" data-s="step3amt" inputmode="decimal" value="${s.step3amt??""}" placeholder="optional"></div>

  </section>
  <section class="card form"><h2>State & local</h2>

    ${stateNote(s)}
    <div class="row"><label for="stateOverride">Your own rate for ${esc(stateSetup(s).wState)}, %<small>Leave blank to use ${((STATES[stateSetup(s).wState]??0)*100).toFixed(2)}%</small></label><input id="stateOverride" data-s="stateOverride" inputmode="decimal" value="${s.stateOverride??""}" placeholder="optional"></div>

    ${stateSetup(s).wState==="Indiana"?`

/* ===================== EVENTS ===================== */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;openDay=null;render();window.scrollTo(0,0);});
document.getElementById("prev").onclick=()=>{periodStart=addDays(periodStart,-periodLen(S.setup));openDay=null;render();};
document.getElementById("next").onclick=()=>{periodStart=addDays(periodStart,periodLen(S.setup));openDay=null;render();};
document.getElementById("todayBtn").onclick=()=>{periodStart=currentPeriodStart(S.setup,new Date());jumpYear=null;render();};
const jumpEl=document.getElementById("jump"), datesBtn=document.getElementById("datesBtn");
function toggleJump(open){jumpEl.hidden=!open;datesBtn.setAttribute("aria-expanded",String(open));jumpYear=periodStart.getFullYear();if(open)jumpEl.innerHTML=jumpPanel();}
datesBtn.onclick=()=>toggleJump(jumpEl.hidden);
jumpEl.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.jy){jumpYear+=+b.dataset.jy;jumpEl.innerHTML=jumpPanel();return;}
  if(b.dataset.jm!=null){periodStart=firstPeriodInMonth(S.setup,jumpYear,+b.dataset.jm);openDay=null;toggleJump(false);render();}});
jumpEl.addEventListener("change",e=>{if(e.target.id==="jumpDate"&&e.target.value){periodStart=currentPeriodStart(S.setup,parseISO(e.target.value));openDay=null;toggleJump(false);render();}});

function clearExample(){S={v:2,setup:{...S.setup},hours:{}};delete S.example;delete S.setup.example;
  S.setup.banks=defaultBanks(iso(new Date()));persist();}
main.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-day],[data-q],[data-goto],[data-jump],[data-del],[data-deltype],[data-delbank],[data-delyes],[data-delhide],[data-delno],[data-addlib]");if(!t)return;
  if(t.dataset.goto){tab=t.dataset.goto;render();return;}
  if(t.dataset.jump){periodStart=parseISO(t.dataset.jump);tab="check";render();window.scrollTo(0,0);return;}
  if(t.dataset.day){openDay=openDay===t.dataset.day?null:t.dataset.day;render();
    if(openDay)document.querySelector(`[data-day="${openDay}"]`)?.scrollIntoView({block:"nearest",behavior:"smooth"});return;}
  if(t.dataset.q){const q=t.dataset.q;let hh={...(S.hours[openDay]||{})};
    if(q==="clear")hh={};else{const add=q.startsWith("+");const [k,v]=q.replace("+","").split(":");hh[k]=add?(+hh[k]||0)+ +v:+v;}
    setHours(openDay,hh);render();return;}
  if(t.dataset.del!=null){S.setup.deds.splice(+t.dataset.del,1);persist();render();return;}
  if(t.dataset.deltype!=null){const i=+t.dataset.deltype;leaveExampleForEdit();const ty=S.setup.types[i];
    if(usage(ty.k).n){pendingDel=pendingDel===i?null:i;render();return;}
    S.setup.types.splice(i,1);pendingDel=null;persist();render();return;}
  if(t.dataset.delyes!=null){S.setup.types.splice(+t.dataset.delyes,1);pendingDel=null;persist();render();return;}
  if(t.dataset.delhide!=null){S.setup.types[+t.dataset.delhide].show=false;pendingDel=null;persist();render();return;}
  if(t.dataset.delno){pendingDel=null;render();return;}
  if(t.dataset.addlib){leaveExampleForEdit();const item=LIBRARY.flatMap(g=>g.items).find(x=>x.k===t.dataset.addlib);
    const nt={...item,show:true};
    if(nt.bank&&!S.setup.banks.some(b=>b.id===nt.bank))delete nt.bank;
    if(nt.earn&&!S.setup.banks.some(b=>b.id===nt.earn)){S.setup.banks.push({id:nt.earn,name:"Comp time",start:0,asOf:iso(new Date()),accrual:0,max:""});}
    S.setup.types.push(nt);persist();render();return;}
  if(t.dataset.delbank!=null){const b=S.setup.banks[+t.dataset.delbank];S.setup.banks.splice(+t.dataset.delbank,1);
    S.setup.types.forEach(x=>{if(x.bank===b.id)delete x.bank;});persist();render();return;}
  const a=t.dataset.act;
  if(a==="start"){clearExample();periodStart=currentPeriodStart(S.setup,new Date());tab="setup";render();}
  if(a==="addDed"){S.setup.deds.push({name:"",amount:0,type:"$",preInc:false,preFica:false});persist();render();}
  if(a==="addType"){pickerOpen=!pickerOpen;pendingDel=null;render();return;}
  if(a==="addCustom"){leaveExampleForEdit();pickerOpen=false;S.setup.types.push({k:"c"+Date.now().toString(36),label:"New pay type",short:"New",kind:"mult",val:1,worked:true,show:true});persist();render();
    const ins=main.querySelectorAll('[data-t$=":label"]');const last=ins[ins.length-1];last?.focus();last?.select();}
  if(a==="addBank"){if(S.example)clearExampleKeepView();const id="b"+Date.now().toString(36);
    S.setup.banks.push({id,name:"New leave",start:0,asOf:iso(new Date()),accrual:0,max:""});
    S.setup.types.push({k:"u"+id,label:"New leave used",short:"Leave",kind:"mult",val:1,worked:false,show:true,bank:id});persist();render();}
  if(a==="saveFile"){const code="SHIFTPAY1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const blob=new Blob([code],{type:"text/plain"});const url=URL.createObjectURL(blob);const link=document.createElement("a");
    link.href=url;link.download="shiftworkpay-backup-"+iso(new Date())+".txt";document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);msg("Backup file saved. Look in your Downloads or Files app.");}
  if(a==="export"){document.getElementById("code").value="SHIFTPAY1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));msg("This code holds all your hours and settings. Keep it somewhere safe.");}
  if(a==="copy"){const ta=document.getElementById("code");try{await navigator.clipboard.writeText(ta.value);msg("Copied.");}catch(err){ta.select();msg("Selected. Use your phone's Copy.");}}
  if(a==="import"){const raw=document.getElementById("code").value.trim();
    try{if(!raw.startsWith("SHIFTPAY1:"))throw 0;const v=JSON.parse(decodeURIComponent(escape(atob(raw.slice(10)))));if(!v.setup||!v.hours)throw 0;
      S=normalize(v);periodStart=currentPeriodStart(S.setup,new Date());persist();tab="check";render();}
    catch(err){msg("That code didn't load. Copy the whole code, starting with SHIFTPAY1:");}}
});
main.addEventListener("change",e=>{if(e.target.id!=="openFile"||!e.target.files[0])return;const fr=new FileReader();
  fr.onload=()=>{document.getElementById("code").value=String(fr.result).trim();main.querySelector('[data-act="import"]').click();};fr.readAsText(e.target.files[0]);});
function msg(t){const m=document.getElementById("codeMsg");if(m)m.textContent=t;}
function setHours(k,hh){
  if(S.example)clearExampleKeepView();
  Object.keys(hh).forEach(x=>{if(!(+hh[x]))delete hh[x];});
  if(Object.keys(hh).length)S.hours[k]=hh;else delete S.hours[k];
  persist();
}
function clearExampleKeepView(){const ps=periodStart;clearExample();periodStart=ps;}
function leaveExampleForEdit(){if(S.example){const ps=periodStart;delete S.example;delete S.setup.example;S.hours={};S.setup.banks=defaultBanks(iso(new Date()));periodStart=ps;}}

main.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.h){const hh={...(S.hours[openDay]||{})};const v=parseFloat(el.value);hh[el.dataset.h]=isNaN(v)?0:v;setHours(openDay,hh);
    const c=calcPeriod(S.setup,periodStart);const d=c.days.find(x=>iso(x.d)===openDay);
    const row=document.querySelector(`[data-day="${openDay}"]`);if(row&&d){row.querySelector(".chips").innerHTML=chipsFor(d.h);row.querySelector(".day-amt").textContent=d.amt?money(d.amt):"";}
    return;}
  if(el.dataset.skip!=null){if(S.example)leaveExampleForEdit();S.skip=S.skip||{};const k=iso(periodStart);const set=new Set(S.skip[k]||[]);
    if(el.checked)set.delete(el.dataset.skip);else set.add(el.dataset.skip);
    if(set.size)S.skip[k]=[...set];else delete S.skip[k];persist();render();return;}
  if(el.dataset.s||el.dataset.t||el.dataset.d||el.dataset.pct||el.dataset.b) leaveExampleForEdit();
  const s=S.setup;
  if(el.dataset.s){const k=el.dataset.s;let v=el.value;
    if(el.hasAttribute("data-bool"))v=v==="true";
    else if(!["status","state","homeState","county","anchor","stateOverride","step3amt"].includes(k))v=v===""?0:parseFloat(v)||0;
    if(k==="freq")v=+el.value;
    s[k]=v;persist();
    if(["status","state","homeState","homeWithhold","freq","step2","exempt","anchor"].includes(k)){if(k==="freq"||k==="anchor")periodStart=currentPeriodStart(s,new Date());render();}
    return;}
  if(el.dataset.t){const [i,f]=el.dataset.t.split(":");const t=s.types[+i];
    if(el.type==="checkbox")t[f]=el.checked;
    else if(f==="val")t[f]=parseFloat(el.value)||0;
    else if(f==="bank"){if(el.value)t.bank=el.value;else delete t.bank;}
    else t[f]=el.value;
    persist();
    if(f==="kind"||f==="show")render();
    else{const r=main.querySelector(`[data-rate="${i}"]`);if(r)r.textContent=money(typeRate(s,t))+"/hr";}
    return;}
  if(el.dataset.b){const [i,f]=el.dataset.b.split(":");const b=s.banks[+i];
    if(f==="name"||f==="asOf")b[f]=el.value;else if(f==="max")b[f]=el.value===""?"":parseFloat(el.value)||0;else b[f]=parseFloat(el.value)||0;
    persist();return;}
  if(el.dataset.pct){s[el.dataset.pct]=(parseFloat(el.value)||0)/100;persist();return;}
  if(el.dataset.d){const [i,f]=el.dataset.d.split(":");const d=s.deds[+i];
    if(el.type==="checkbox")d[f]=el.checked;else if(f==="amount")d[f]=parseFloat(el.value)||0;else d[f]=el.value;persist();return;}
});
// Re-draw leave cards when a field is finished (not on every keystroke, so typing isn't interrupted)
main.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.b)render();});
main.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details[data-bank]"))openBanks[e.target.dataset.bank]=e.target.open;},true);
