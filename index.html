<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shift Pay Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324D">
<meta name="description" content="Log your shift hours and see your paycheck before payday.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShiftPay">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky period bar on top, bottom tab bar, content cards between. Dispatch-console feel: deep slate + signal amber. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#D6DEE7;
  --fg:#14202E; --muted:#5A6878; --navy:#17324D; --on-navy:#FFFFFF;
  --accent:#C77A0A; --accent-soft:#FBEBD0; --good:#1E7A4C; --good-soft:#DDF1E5;
  --tax:#B4483A; --input:#FFF8E6; --input-line:#E8C980; --focus:#2F6FB3;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#16222F; --surface-2:#1B2A39; --line:#2A3B4D;
  --fg:#E8EEF4; --muted:#93A3B5; --navy:#0A2236; --on-navy:#F2F6FA;
  --accent:#F0A63A; --accent-soft:#3A2A12; --good:#4CC488; --good-soft:#143326;
  --tax:#F08A7A; --input:#22303F; --input-line:#5C4A22; --focus:#6FA8E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16222F; --surface-2:#1B2A39; --line:#2A3B4D;
  --fg:#E8EEF4; --muted:#93A3B5; --navy:#0A2236; --on-navy:#F2F6FA;
  --accent:#F0A63A; --accent-soft:#3A2A12; --good:#4CC488; --good-soft:#143326;
  --tax:#F08A7A; --input:#22303F; --input-line:#5C4A22; --focus:#6FA8E8; color-scheme:dark}
html,body{height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy);padding:10px 16px 12px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;max-width:640px;margin:0 auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.brand h1 b{color:var(--accent)}
.save{font-size:11.5px;opacity:.75}
.period{display:flex;align-items:center;gap:8px;max-width:640px;margin:8px auto 0}
.period .lbl{flex:1;min-width:0;text-align:center}
.period .dates{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.02em}
.period .pay{font-size:12px;opacity:.8}
.arrow{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--on-navy);font-size:20px;line-height:1}
.today-btn{font-size:11px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--on-navy);border-radius:20px;padding:2px 10px;margin-top:2px}

main{max-width:640px;margin:0 auto;padding:16px 16px 110px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.banner{background:var(--accent-soft);border:1px solid var(--input-line);border-radius:var(--r);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--tax)}

/* net hero */
.hero{background:var(--navy);color:var(--on-navy);border:none}
.hero .k{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;font-size:14px;opacity:.85}
.hero .net{font-family:var(--f-num);font-size:44px;font-weight:600;line-height:1.1;margin:4px 0 2px;color:var(--accent)}
.hero .sub{font-size:13px;opacity:.85}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 8px;background:rgba(255,255,255,.15)}
.split span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;opacity:.95}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px}
.stat .v{font-family:var(--f-num);font-size:16px;font-weight:600}
.stat .l{font-size:11px;opacity:.8}

/* line tables */
.lines{display:grid;gap:0}
.line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border-bottom:none}
.line .d{color:var(--muted);font-size:12.5px}
.line.total{font-weight:600;border-top:2px solid var(--fg);border-bottom:none;padding-top:9px;margin-top:2px}
.line .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.minus{color:var(--tax)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
details[open] summary{margin-bottom:8px}

/* hours */
.week-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.week-h h2{margin:0}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:4px 0 12px;border:1px solid var(--line)}
.meter span{display:block;height:100%;background:var(--accent)}
.day{border-top:1px solid var(--line)}
.day:first-of-type{border-top:none}
.day-row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:10px 0;text-align:left}
.day-date{width:56px;flex:none}
.day-date b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1}
.day-date span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;border-radius:20px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.ot{background:var(--accent-soft);border-color:var(--input-line)}
.chip.off{color:var(--muted);border-style:dashed;background:transparent}
.day-amt{font-family:var(--f-num);font-size:14px;white-space:nowrap}
.today .day-date b{color:var(--accent)}
.editor{padding:4px 0 14px;display:grid;gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--input-line);background:var(--input);border-radius:20px;padding:6px 11px;font-size:13px;font-weight:600}
.quick button.clear{background:transparent;border-color:var(--line);color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,textarea{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--input-line);border-radius:8px;padding:8px;width:100%;min-width:0}
.f input{text-align:center;font-family:var(--f-num);font-size:16px;padding:7px 4px}
textarea{font-family:var(--f-num);font-size:12px;min-height:80px;resize:vertical}

/* setup form */
.form{display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center}
.row > label{font-size:14px}
.row small,.hint{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.computed{font-family:var(--f-num);text-align:right;padding:8px;color:var(--muted)}
.mults{display:grid;grid-template-columns:1fr 80px 90px;gap:8px 10px;align-items:center;font-size:14px}
.mults .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mults .rate{font-family:var(--f-num);text-align:right}
.ded{display:grid;grid-template-columns:1fr 84px 64px 34px;gap:6px;align-items:center}
.ded + .ded{margin-top:2px}
.ded-flags{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 10px}
.ded-flags label{display:flex;gap:5px;align-items:center}
.ded-flags input{width:auto}
.x{border:none;background:none;color:var(--muted);font-size:20px;padding:0}

/* history */
.hist{display:grid;gap:0}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline;background:none;border-left:none;border-right:none;border-top:none;text-align:left;width:100%}
.hrow:last-child{border-bottom:none}
.hrow .p{font-weight:600}
.hrow .s{grid-column:1/-1;font-size:12px;color:var(--muted)}
.hrow .g,.hrow .n{font-family:var(--f-num);text-align:right}
.hrow .n{color:var(--good);font-weight:600}
.ytd{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ytd div{background:var(--surface-2);border-radius:10px;padding:10px}
.ytd .v{font-family:var(--f-num);font-weight:600;font-size:17px}
.ytd .l{font-size:12px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:640px}
nav.tabs button{border:none;background:none;padding:6px 0;border-radius:10px;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;justify-items:center;gap:1px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--fg);background:var(--surface-2)}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}
@media (max-width:420px){.fields{grid-template-columns:repeat(4,1fr)}.row{grid-template-columns:1fr 128px}.hero .net{font-size:38px}}
@media (prefers-reduced-motion:no-preference){.editor{animation:drop .16s ease-out}@keyframes drop{from{opacity:.4;transform:translateY(-4px)}}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><h1>Shift<b>Pay</b></h1><span class="save" id="saveState">Loading…</span></div>
  <div class="period">
    <button class="arrow" id="prev" aria-label="Previous pay period">‹</button>
    <div class="lbl"><div class="dates" id="pDates">—</div><div class="pay" id="pPay"></div><button class="today-btn" id="todayBtn" hidden>Jump to current period</button></div>
    <button class="arrow" id="next" aria-label="Next pay period">›</button>
  </div>
</header>

<main id="main"></main>

<nav class="tabs" aria-label="Sections"><div>
  <button data-tab="check" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Check</button>
  <button data-tab="hours"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Hours</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V10M12 16V6M17 16v-4"/></svg>History</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
</div></nav>

<script>
/* ===================== TAX DATA (2026) — update each January ===================== */
const TAX_YEAR = 2026;
const FED = {
  rates:[0.10,0.12,0.22,0.24,0.32,0.35,0.37],
  single:{std:16100, br:[0,12400,50400,105700,201775,256225,640600]},
  mfj:{std:32200, br:[0,24800,100800,211400,403550,512450,768700]},
  hoh:{std:24150, br:[0,17700,67450,105700,201750,256200,640600]},
  childCredit:2200, otherCredit:500, ssRate:0.062, medRate:0.0145
};
const STATES = {"Alabama":.04,"Alaska":0,"Arizona":.025,"Arkansas":.039,"California":.05,"Colorado":.044,"Connecticut":.05,"Delaware":.05,"District of Columbia":.06,"Florida":0,"Georgia":.0519,"Hawaii":.07,"Idaho":.053,"Illinois":.0495,"Indiana":.0295,"Iowa":.038,"Kansas":.052,"Kentucky":.035,"Louisiana":.03,"Maine":.06,"Maryland":.0475,"Massachusetts":.05,"Michigan":.0425,"Minnesota":.06,"Mississippi":.044,"Missouri":.045,"Montana":.055,"Nebraska":.05,"Nevada":0,"New Hampshire":0,"New Jersey":.045,"New Mexico":.045,"New York":.055,"North Carolina":.0399,"North Dakota":.015,"Ohio":.0275,"Oklahoma":.045,"Oregon":.08,"Pennsylvania":.0307,"Rhode Island":.0475,"South Carolina":.05,"South Dakota":0,"Tennessee":0,"Texas":0,"Utah":.045,"Vermont":.06,"Virginia":.05,"Washington":0,"West Virginia":.045,"Wisconsin":.053,"Wyoming":0};
const FLAT = new Set(["Arizona","Colorado","Idaho","Illinois","Indiana","Iowa","Kentucky","Louisiana","Michigan","North Carolina","Pennsylvania","Utah","Massachusetts","Ohio","Georgia","Mississippi"]);
const NO_TAX = new Set(Object.keys(STATES).filter(s=>STATES[s]===0));

/* ===================== PAY TYPES ===================== */
const TYPES = [
  {k:"reg", label:"Regular", short:"Reg", worked:true},
  {k:"ot",  label:"Overtime", short:"OT", worked:true},
  {k:"dt",  label:"Double time", short:"DT", worked:true},
  {k:"hw",  label:"Holiday worked", short:"Hol wk", worked:true},
  {k:"hot", label:"Holiday OT", short:"Hol OT", worked:true},
  {k:"prem",label:"Premium", short:"Prem", worked:false},
  {k:"hp",  label:"Paid holiday", short:"Hol pd", worked:false},
  {k:"lv",  label:"Sick/Comp/Vac", short:"Leave", worked:false},
];

/* ===================== STATE ===================== */
const EXAMPLE = () => {
  const s = defaultSetup();
  s.example = true;
  const start = currentPeriodStart(s, new Date());
  const hours = {};
  const pat = [{reg:8,ot:4},{reg:8,ot:4},{},{ot:12},{reg:8},{reg:8,ot:4},{},{reg:8},{reg:8,ot:4},{lv:8},{},{ot:12},{reg:8,ot:4},{reg:8}];
  pat.forEach((h,i)=>{ if(Object.keys(h).length) hours[iso(addDays(start,i))]=h; });
  return {v:1, setup:s, hours, example:true};
};
function defaultSetup(){
  return {
    rate:25.00, mult:{reg:1,ot:1.5,dt:2,hw:1.5,hot:2,hp:1,lv:1}, prem:1.00,
    freq:26, anchor:"2026-07-27", payLag:15,
    status:"single", step2:false, kids:0, others:0, s4a:0, s4b:0, s4c:0, exempt:false,
    state:"Indiana", stateOverride:"", county:"Lake County", countyRate:0.015,
    inPersonal:1, inAddl:0, inAdopt:0, stateExtra:0, countyExtra:0,
    deds:[{name:"Medical",amount:79,type:"$",preInc:true,preFica:true},{name:"Union dues",amount:69,type:"$",preInc:false,preFica:false}]
  };
}
let S = null;           // full app state
let tab = "check";
let periodStart = null; // Date
let openDay = null;
let store = {kind:"none", save:null};

/* ===================== DATES ===================== */
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
function dayDiff(a,b){return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);}
function periodLen(s){return s.freq===52?7:14;}
function currentPeriodStart(s,d){const a=parseISO(s.anchor);const L=periodLen(s);const k=Math.floor(dayDiff(a,d)/L);return addDays(a,k*L);}
const fmtD = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const money = n => (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const hrs = n => (Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
const r2 = n => Math.round((n+Number.EPSILON)*100)/100;

/* ===================== CALC ENGINE (mirrors the spreadsheet) ===================== */
function rates(s){const o={};TYPES.forEach(t=>o[t.k]=t.k==="prem"?(+s.prem||0):(+s.rate||0)*(+s.mult[t.k]||0));return o;}
function annualFedTax(x,s){
  const t=FED[s.status]; const half=s.step2?0.5:1;
  const std=t.std*half; let tax=0;
  for(let i=0;i<FED.rates.length;i++){
    const lo=std+t.br[i]*half, hi=i+1<FED.rates.length?std+t.br[i+1]*half:Infinity;
    if(x>lo) tax+=(Math.min(x,hi)-lo)*FED.rates[i];
  }
  return tax;
}
function stateRate(s){return s.stateOverride!==""&&s.stateOverride!=null?(+s.stateOverride)/100:(STATES[s.state]??0);}
function calcPeriod(s,start){
  const L=periodLen(s), R=rates(s);
  const days=[]; const tot={}; TYPES.forEach(t=>tot[t.k]=0);
  for(let i=0;i<L;i++){const d=addDays(start,i);const h=S.hours[iso(d)]||{};
    let amt=0,worked=0;TYPES.forEach(t=>{const v=+h[t.k]||0;tot[t.k]+=v;amt+=v*R[t.k];if(t.worked)worked+=v;});
    days.push({d,h,amt,worked});}
  const earn=TYPES.map(t=>({...t,hours:tot[t.k],rate:R[t.k],amount:r2(tot[t.k]*R[t.k])}));
  const gross=r2(earn.reduce((a,e)=>a+e.amount,0));
  const deds=s.deds.filter(d=>d.name).map(d=>({...d,amt:r2(d.type==="%"?(+d.amount/100)*gross:+d.amount||0)}));
  const preInc=deds.filter(d=>d.preInc).reduce((a,d)=>a+d.amt,0);
  const preFica=deds.filter(d=>d.preFica).reduce((a,d)=>a+d.amt,0);
  const taxable=Math.max(0,gross-preInc);
  const P=s.freq;
  const annual=taxable*P, adj=Math.max(0,annual+(+s.s4a||0)-(+s.s4b||0));
  const yearTax=annualFedTax(adj,s);
  const credits=(+s.kids||0)*FED.childCredit+(+s.others||0)*FED.otherCredit;
  const afterCred=Math.max(0,yearTax-credits);
  const fed=s.exempt?0:r2(afterCred/P)+(+s.s4c||0);
  const ficaW=Math.max(0,gross-preFica);
  const ss=r2(ficaW*FED.ssRate), med=r2(ficaW*FED.medRate);
  const exemptYr=s.state==="Indiana"?(+s.inPersonal||0)*1000+(+s.inAddl||0)*1500+(+s.inAdopt||0)*3000:0;
  const exPer=r2(exemptYr/P);
  const stW=Math.max(0,taxable-exPer);
  const sr=stateRate(s);
  const st=r2(stW*sr)+(+s.stateExtra||0);
  const co=r2(stW*(+s.countyRate||0))+(+s.countyExtra||0);
  const taxes=r2(fed+ss+med+st+co);
  const dedTot=r2(deds.reduce((a,d)=>a+d.amt,0));
  const net=r2(gross-taxes-dedTot);
  const worked=TYPES.filter(t=>t.worked).reduce((a,t)=>a+tot[t.k],0);
  const paid=TYPES.filter(t=>t.k!=="prem").reduce((a,t)=>a+tot[t.k],0);
  return {days,earn,gross,deds,preInc,preFica,taxable,annual,adj,yearTax,credits,afterCred,fed,ficaW,ss,med,exPer,stW,sr,st,co,taxes,dedTot,net,worked,paid,tot};
}

/* ===================== STORAGE ===================== */
let saveTimer=null, saving=false, pending=false;
function setSaveLabel(t){document.getElementById("saveState").textContent=t;}
function persist(){
  if(S.example) return;
  clearTimeout(saveTimer);
  setSaveLabel("Saving…");
  saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving){pending=true;return;}
  saving=true;
  try{ await store.save(JSON.parse(JSON.stringify(S))); setSaveLabel("Saved on this phone"); }
  catch(e){ setSaveLabel("Couldn't save. Your changes are still on screen."); }
  saving=false; if(pending){pending=false;flush();}
}
function localGet(){try{const v=localStorage.getItem("shiftpay.v1");return v?JSON.parse(v):null;}catch(e){return null;}}
function localSet(v){try{localStorage.setItem("shiftpay.v1",JSON.stringify(v));}catch(e){}}

    const row=document.querySelector(`[data-day="${openDay}"]`);if(row&&d){row.querySelector(".chips").innerHTML=chipsFor(d.h);row.querySelector(".day-amt").textContent=d.amt?money(d.amt):"";}
    return;}
  if(S.example&&(el.dataset.s||el.dataset.m||el.dataset.d||el.dataset.pct)){delete S.example;delete S.setup.example;S.hours={};}
  const s=S.setup;
  if(el.dataset.s){const k=el.dataset.s;let v=el.value;
    if(el.hasAttribute("data-bool"))v=v==="true";
    else if(!["status","state","county","anchor","stateOverride"].includes(k))v=v===""?0:parseFloat(v)||0;
    if(k==="freq")v=+el.value;
    s[k]=v;persist();
    if(k==="rate"||k==="prem")document.querySelectorAll(".mults .rate").forEach((sp,i)=>{const t=TYPES.filter(t=>t.k!=="prem")[i];sp.textContent=t?money(s.rate*s.mult[t.k]):money(+s.prem);});
    if(["status","state","freq","step2","exempt","anchor"].includes(k)){if(k==="freq"||k==="anchor")periodStart=currentPeriodStart(s,new Date());render();}
    return;}
  if(el.dataset.m){s.mult[el.dataset.m]=parseFloat(el.value)||0;persist();el.nextElementSibling.textContent=money(s.rate*s.mult[el.dataset.m]);return;}
  if(el.dataset.pct){s[el.dataset.pct]=(parseFloat(el.value)||0)/100;persist();return;}
  if(el.dataset.d){const [i,f]=el.dataset.d.split(":");const d=s.deds[+i];
    if(el.type==="checkbox")d[f]=el.checked;else if(f==="amount")d[f]=parseFloat(el.value)||0;else d[f]=el.value;persist();return;}
});

/* ===================== BOOT ===================== */
(async function(){
  S=EXAMPLE();periodStart=currentPeriodStart(S.setup,new Date());render();
  const loaded=await initStore();
  if(loaded&&loaded.setup){S=loaded;S.setup={...defaultSetup(),...S.setup,mult:{...defaultSetup().mult,...(S.setup.mult||{})}};periodStart=currentPeriodStart(S.setup,new Date());
    setSaveLabel("Saved on this phone");}
  else setSaveLabel("Example data");
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
  render();
})();
</script>
